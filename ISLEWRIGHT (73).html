/* ---- seeded noise ---- */
function h2(x,y,s){ let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,982451653)|0; n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; }

function fbm(x,y,s,o){ let a=.5,f=1,t=0,n=0; for(let i=0;i<o;i++){ t+=a*vnoise(x*f,y*f,s+i*17); n+=a; a*=.5; f*=2.03; } return t/n; }

/* ---- the world (G): everything that belongs to one save ---- */

const SEA=.27;                              // waterline in the height field

const tk=(x,y)=>(x+32768)*65536+(y+32768);

/* ---- calendar: real dates, seasons, day length ---- */

const pad2=v=>String(v).padStart(2,'0');
const SEAS_START=[[3,20],[6,21],[9,22],[12,21]];               // spring, summer, autumn and winter begin on these dates (northern hemisphere)

function dayLenOf(dn){ const c=dnToYMD(dn), doy=dn-ymdToDn(c.y,1,1)+1; return 12+3.4*Math.sin(2*Math.PI*(doy-80)/365)*(SET.south?-1:1); }
function syncPC(){

}
function calcEtod(){
  const key=G.dn*2+(SET.south?1:0); if(G._dk!==key){ G._dk=key; G._dl=dayLenOf(G.dn); }
  const sr=12.8-G._dl/2, ss=12.8+G._dl/2, t=G.tod; G.sr=sr; G.ss=ss;

const encA=a=>String.fromCharCode.apply(null,Array.from(a,v=>48+v)), decA=t=>Uint8Array.from(t,c=>c.charCodeAt(0)-48);

/* ---- climate and biomes ---- */
const BIO=['PLAINS','FOREST','TAIGA','TUNDRA','DESERT','SAVANNA','JUNGLE','SWAMP'];
const BIOC=[0x5c984a,0x2f6a2a,0x34584a,0xdfe8ec,0xdcb572,0xb6a850,0x2a8a3e,0x5e7046];     // minimap colours
let CLT=.5, CLM=.5;
function climate(x,y){
  const s=G.seed, w=(fbm(x*.01+700,y*.01-300,s+90,2)-.5)*70;
  CLT=clamp((fbm((x+w)*.0058+1300,y*.0058-800,s+91,3)-.5)*2.3+.5,0,1);

function biomeOf(t,m,v){
  if(t<.14)return 3;
  if(t<.3)return m<.15?3:2;
  if(t>.7){ return m<.38?4:m<.62?5:6; }
  if(m>.68&&v<.42)return 7;

/* ---- big basins: oceans and lakes are star-shaped (never rings) and spaced so none can touch another,
        so the dry land around them always stays one connected landmass ---- */
let BR=1;
function basin(x,y,s,cell,prob,rmin,rmax,lo,hi,salt){
  const cx=Math.floor(x/cell), cy=Math.floor(y/cell);
  if(h2(cx,cy,s+salt)>prob)return 9;
  const px=(cx+lo+h2(cx,cy,s+salt+1)*(hi-lo))*cell, py=(cy+lo+h2(cx,cy,s+salt+2)*(hi-lo))*cell, dx=x-px, dy=y-py, dd=Math.hypot(dx,dy);

function baseV(x,y){

  let v=.43+(e-.5)*.62+(r-.5)*.16;

  v=Math.max(v,.2);                                            // low ground is at worst a wadeable pond
  // oceans: huge, with a long shallow shelf, then deep water; a sandy beach on the land side
  const od=basin(x,y,s,1300,.8,140,280,.38,.62,40);
  let sh=-999; if(od<9){ sh=(1-od)*BR;
    if(sh>=0)return SEA-.006-smooth(0,22,sh)*.25+(vnoise(x*.05,y*.05,s+49)-.5)*.03*smooth(0,10,sh);
    if(sh>-12)v=lerp(SEA+.004,Math.max(v,.34),smooth(0,11,-sh));

const tileV=(x,y)=>{ const o=G.ovr.get(tk(x,y)); return o!==undefined?o:baseV(x,y); };

/* ---- chunks: terrain samples, resource nodes, baked picture ---- */
const chunks=new Map(); let frameNo=0;
const ckey=(cx,cy)=>(cx+4096)*8192+(cy+4096);
function getChunk(cx,cy){ const k=ckey(cx,cy); let c=chunks.get(k); if(!c){ c=genChunk(cx,cy); chunks.set(k,c); } return c; }
const forestF=(x,y)=>fbm(x*.055+500,y*.055-200,G.seed+5,3);
/* low plants worth picking: chosen by biome, with wet-ground plants beside water */
function forageKind(B,a,b,wd){
  const wet=wd<4.5;
  if(wet&&B!==3&&B!==4&&a<.07)return b<.4?5:b<.8?6:13;
  const pk=arr=>arr[Math.min(arr.length-1,Math.floor(b*arr.length))];
  if(B===0){ if(a<.034)return pk([10,10,0,1,2,3,3,7,8,13,15,14]); }
  else if(B===1){ if(a<.026)return pk([0,0,1,1,4,3,7,8,15,14,2]); }
  else if(B===2){ if(a<.012)return pk([4,4,8,3,15]); }
  else if(B===3){ if(a<.003)return 4; }
  else if(B===4){ if(a<.005)return pk([9,8,13]); }
  else if(B===5){ if(a<.022)return pk([10,10,9,7,13,13,15]); }
  else if(B===6){ if(a<.02)return pk([1,4,13,13,15,14,5]); }
  else if(B===7){ if(a<.034)return pk([6,5,4,13,13,12]); }
  return -1;
}
function genChunk(cx,cy){

    const x=cx*CS+i, y=cy*CS+j, o=(j+1)*S2+i+1, v=c.v[o], cl=clsV(v), key=tk(x,y), f=forestF(x,y), B=c.bm[o];

    if(cl===3){
      const fs=smooth(.47,.68,f);
      const pk=(arr)=>arr[Math.min(arr.length-1,Math.floor(r3*arr.length))];
      if(B===0){ const tp=fs*.5+.012; if(r<tp)t=v>.5&&r2>.35?2:1; else if(r<tp+.058&&f<.6){ t=5; vr=r3<.14?0:r3<.2?2:pk([3,4,5,6,7,8,9,3,4,7,8,9,10,13]); } }
      else if(B===1){ const tp=.2+fs*.38; if(r<tp)t=(v>.5&&r2>.55)?2:1; else if(r<tp+.03){ t=5; vr=pk([0,0,1,11,11,2,2,12,13,3,6,5]); } }
      else if(B===2){ const tp=.14+fs*.34; if(r<tp){ t=2; vr=Math.floor(r2*4); } else if(r<tp+.02){ t=5; vr=pk([1,1,1,11,2,12,6]); } }
      else if(B===3){ const tp=.012+fs*.06; if(r<tp)t=2; else if(r<tp+.003){ t=5; vr=2; } }
      else if(B===4){ if(r<.0065+(fbm(x*.07+400,y*.07,sd+11,2)>.58?.012:0))t=6; }
      else if(B===5){ const tp=.011+fs*.03; if(r<tp)t=7; else if(r<tp+.04){ t=5; vr=pk([10,10,4,9,9,4,2,13,3]); } }
      else if(B===6){ const tp=.3+fs*.3; if(r<tp){ if(r2<.26)t=3; else{ t=1; vr=(r2<.6?0:2)|8; } } else if(r<tp+.034){ t=5; vr=pk([3,8,0,1,3,8,11,12,9]); } }
      else{ const tp=.07+fs*.14; if(r<tp){ t=1; vr=3; } else if(r<tp+.03){ t=5; vr=pk([2,6,12,13,13,1,5]); } }
      if(!t&&(B===1||B===2||B===6||B===7)&&h2(x,y,sd+12)<(B===7?.016:.012)&&f>.42){ t=8; vr=Math.floor(r2*4); }                // mushrooms on the damp woodland floor
      else if(!t&&B===0&&h2(x,y,sd+12)<.004&&f>.55){ t=8; vr=Math.floor(r2*4); }
      if(!t){ const fk=forageKind(B,h2(x,y,sd+13),h2(x,y,sd+14),c.wd[o]); if(fk>=0){ t=9; vr=fk; } }

const bById=id=>G.bmap?G.bmap.get(id)||null:null;
const bAt=(x,y)=>{ const id=G.occ.get(tk(x,y)); return id?bById(id):null; };
function nodeAt(x,y){ return chunkOf(x,y).nm.get(tk(x,y))||null; }
function removeNode(n){ const c=chunkOf(n.x,n.y), i=c.nodes.indexOf(n); if(i>=0)c.nodes.splice(i,1); c.nm.delete(tk(n.x,n.y)); const k=tk(n.x,n.y); if(G.planted.has(k))G.planted.delete(k); else G.removed.add(k); }
function addNode(t,x,y){ const c=chunkOf(x,y), k=tk(x,y); if(c.nm.has(k))return null; const n={x,y,t,vr:Math.floor(h2(x,y,9)*4),hp:t===4?4:t===5?2:3}; c.nodes.push(n); c.nodes.sort((a,b)=>a.y-b.y); c.nm.set(k,n); G.planted.set(k,t); G.removed.delete(k); return n; }
let WADE_OK=false;                                                    // on while an officer chases or anyone runs: shallow water is then passable (it is never picked on purpose)
const walkableTile=(x,y)=>{
  const cl=clsAt(x,y); if(cl<2&&G.floor.get(tk(x,y))!==3){ if(!(WADE_OK&&cl===1))return false; }
  const id=G.occ.get(tk(x,y)); if(id){ const b=bById(id); if(b&&!BT[b.t].walk)return false; }
  const n=nodeAt(x,y); if(n&&n.t!==5&&n.t!==8&&n.t!==9)return false;
  if(G.camps)for(const cp of G.camps){ if(cp.x===x&&cp.y===y)return false; }
  return true;
};
function connMaskFor(b){
  const t=BT[b.t]; if(!t.joins)return 0; let m=0;
  const same=(x,y)=>{ const o=bAt(x,y); return o&&BT[o.t].joins&&BT[o.t].m===t.m; };
  if(same(b.x,b.y-1))m|=1; if(same(b.x+1,b.y))m|=2; if(same(b.x,b.y+1))m|=4; if(same(b.x-1,b.y))m|=8;
  return m;
}
function refreshConn(b){
  for(const [dx,dy] of [[0,0],[0,-1],[1,0],[0,1],[-1,0]]){ const o=bAt(b.x+dx,b.y+dy); if(o&&BT[o.t].joins)o.mask=connMaskFor(o); }
}

let sel=null;
function paintFor(id){
  const d=BT[id];
  if(PAINT.auto){
    const house=d.cap||['tavern','library','church','hall'].includes(d.k);
    if(house&&d.k!=='tent'){ const r=Math.random; return {wc:WALLC[Math.floor(r()*WALLC.length)],rc:ROOFC[Math.floor(r()*ROOFC.length)],tx:d.k==='church'||d.k==='hall'?d.tx:Math.floor(r()*4)}; }
    return {wc:d.wc,rc:d.rc,tx:d.tx};
  }
  if(['field','fence','hedge','fire'].includes(d.k))return {wc:d.wc,rc:d.rc,tx:d.tx};
  return {wc:WALLC[PAINT.wi],rc:ROOFC[PAINT.ri],tx:PAINT.tx};
}
function placeReason(id,x,y,w,h){
  const d=BT[id]; w=w||d.w; h=h||d.h;
  if(G.mode===2&&!unlocked(id))return 'LOCKED: NEEDS TIER '+d.tier;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const cl=clsAt(x+i,y+j);
    if(d.water){ if(cl>=2||G.floor.get(tk(x+i,y+j)))return 'NEEDS OPEN WATER'; }
    else if(cl<2&&G.floor.get(tk(x+i,y+j))!==3)return 'MUST BE ON LAND';
    if(G.occ.has(tk(x+i,y+j)))return 'SOMETHING IS ALREADY HERE';
  }
  if(!canAfford(d.cost))return 'NOT ENOUGH: '+costText(d.cost);
  return null;
}
function placeBuilding(id,x,y,free,w,h,ov){
  const d=BT[id], pc=paintFor(id); w=w||d.w; h=h||d.h;
  const b={id:G.bid++,t:id,x,y,w,h,o:ov||undefined,wc:pc.wc,rc:pc.rc,tx:pc.tx,prog:(G.mode===0||free)?1:0,mask:0,stage:0,growth:0,users:0,lit:false};
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){ const n=nodeAt(x+i,y+j); if(n)removeNode(n); G.occ.set(tk(x+i,y+j),b.id); }
  G.B.push(b); G.bmap.set(b.id,b); b.mask=connMaskFor(b); refreshConn(b); G.dirtyHomes=1;
  return b;
}
function demolish(b){
  if(G.mode!==0){ for(const r in BT[b.t].cost)gainRes(r,Math.floor(BT[b.t].cost[r]*.5)); }
  for(const p of G.P){ if(p.inside===b.id)leave(p); if(p.workB===b.id){ p.workB=0; if(p.act==='work')endAct(p,0); } if(p.emp===b.id){ p.emp=0; p.job=null; } if(p.tgtB===b.id&&p.act!=='idle'&&p.act!=='work')endAct(p,0); }
  for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)G.occ.delete(tk(b.x+i,b.y+j));
  const i=G.B.indexOf(b); if(i>=0)G.B.splice(i,1); G.bmap.delete(b.id);
  for(const p of G.P){ if(p.home===b.id)p.home=null; }
  G.dirtyHomes=1; G.dirtyJobs=1;
  refreshConn(b); sfx.pop(); toast(BT[b.t].n+' REMOVED');
}
const NOPAINT=new Set(['field','fire','quarry','orchard','pen','apiary','lamp','barrel']);
const paintable=b=>{ const d=BT[b.t]; if(NOPAINT.has(d.k))return false; if(d.k==='conn'&&d.m!=='wall')return false; return true; };
function paintBuilding(b){ if(!paintable(b)){ toast('THIS CANNOT BE REPAINTED',RED); return; } const pc=paintFor(b.t); if(!PAINT.auto||true){ const d=BT[b.t]; if(['field','fire'].includes(d.k))return; b.wc=pc.wc; b.rc=pc.rc; b.tx=pc.tx; } sfx.tick(); }
function floorReason(it,x,y){
  const cl=clsAt(x,y);
  if(it.water){ if(cl<1)return 'TOO DEEP'; } else if(cl<2)return 'MUST BE ON LAND';
  if(G.occ.has(tk(x,y))&&!BT[bById(G.occ.get(tk(x,y))).t].walk)return 'BUILDING IN THE WAY';
  if(G.floor.get(tk(x,y))===it.f&&!G.fpx.has(tk(x,y)))return 'SAME';
  if(!canAfford(it.cost))return 'NOT ENOUGH: '+costText(it.cost);
  return null;
}
function terrainReason(it,x,y){
  if(G.occ.has(tk(x,y)))return 'BUILDING IN THE WAY';
  const cur=vAt(x,y); if(Math.abs(cur-it.v)<.02&&(G.tstyle.get(tk(x,y))||0)===(it.style||0))return 'SAME';
  if(!canAfford(it.cost))return 'NOT ENOUGH: '+costText(it.cost);
  return null;
}
let lastWarn=0;
function warn(s){ if(performance.now()-lastWarn>900){ toast(s,RED); lastWarn=performance.now(); } }
function relaxShore(x,y){
  /* sand strips that are no longer next to water become dry sand */
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const tx=x+dx, ty=y+dy, v=vAt(tx,ty); if(v<SEA||v>=.30)continue;
    let wat=false; for(let j=-1;j<=1&&!wat;j++)for(let i=-1;i<=1;i++){ if(vAt(tx+i,ty+j)<SEA){ wat=true; break; } }
    if(!wat)setOvr(tx,ty,.315);
  }
}
const BRUSH={px:16,show:-9}, BLV=[16,8,4,2,1];
const bDimsStub=0;
function bDims(id){ const d=BT[id]; return {w:d.w,h:d.h}; }
function bOver(id){ return undefined; }
function pxRect(){ const n=BRUSH.px; return [Math.floor(mouse.wx-n/2+.5),Math.floor(mouse.wy-n/2+.5),n]; }
function pixelApply(it,first){
  const [x0,y0,n]=pxRect(), seen=new Map(); let did=0;
  for(let y=y0;y<y0+n;y++)for(let x=x0;x<x0+n;x++){
    const tx=Math.floor(x/TS), ty=Math.floor(y/TS), lx=x-tx*TS, ly=y-ty*TS, k=tk(tx,ty);
    if(it.k==='f'){
      if(!seen.has(k)){ const r=floorReason(it,tx,ty); seen.set(k,!r); if(r&&r!=='SAME'&&first)warn(r); }
      if(!seen.get(k))continue;
      let a=G.fpx.get(k); if(!a){ a=new Uint8Array(256); a.fill(G.floor.get(k)||0); G.fpx.set(k,a); }
      a[ly*16+lx]=it.f; G.floor.set(k,it.f); did=1; chunkOf(tx,ty).dirty=true;
    }else if(it.k==='t'){
      if(!seen.has(k)){ seen.set(k,clsAt(tx,ty)>=2&&!G.occ.has(k)); }
      if(!seen.get(k))continue;
      let a=G.spx.get(k); if(!a){ a=new Uint8Array(256); G.spx.set(k,a); }
      a[ly*16+lx]=it.pc; did=1; chunkOf(tx,ty).dirty=true;
    }else{
      if(!G.floor.get(k))continue;
      let a=G.fpx.get(k); if(!a){ a=new Uint8Array(256); a.fill(G.floor.get(k)); G.fpx.set(k,a); }
      a[ly*16+lx]=0; did=1; chunkOf(tx,ty).dirty=true;
      let any=0; for(let q=0;q<256;q++)if(a[q]){ any=1; break; } if(!any){ G.fpx.delete(k); G.floor.delete(k); }
    }
  }
  if(!did&&it.k==='tool'&&first)applyOne(mouse.tx,mouse.ty,true);
}
function applyTool(tx,ty,first){
  const it=curItem();
  if(it&&BRUSH.px<16&&TOOL.cat!==6&&(it.k==='f'||(it.k==='t'&&it.pc&&it.v>=SEA)||(it.k==='tool'&&it.t==='erase'))){ pixelApply(it,first); return; }
  applyOne(tx,ty,first);
}
function applyOne(tx,ty,first){
  const it=curItem(); if(!it)return;
  if(TOOL.cat===6){ if(first){ const b=bAt(tx,ty); if(b)paintBuilding(b); } return; }
  if(it.k==='b'){
    const d=BT[it.id]; if(!first&&!d.joins)return; const dm=bDims(it.id);
    const x=tx-Math.floor((dm.w-1)/2), y=ty-Math.floor((dm.h-1)/2), r=placeReason(it.id,x,y,dm.w,dm.h);
    if(r){ if(first)warn(r); return; }
    spend(d.cost); const b=placeBuilding(it.id,x,y,false,dm.w,dm.h,bOver(it.id)); sfx.place(); if(G.mode!==0&&first&&b.prog<1&&G.P.length===0)toast('YOU NEED SETTLERS TO BUILD',RED);
  }else if(it.k==='f'){
    const r=floorReason(it,tx,ty); if(r){ if(first&&r!=='SAME')warn(r); return; }
    spend(it.cost); G.floor.set(tk(tx,ty),it.f); G.fpx.delete(tk(tx,ty)); dirtyAround(tx,ty); sfx.tick();
  }else if(it.k==='t'){
    const r=terrainReason(it,tx,ty); if(r){ if(first&&r!=='SAME')warn(r); return; }
    spend(it.cost); const n=nodeAt(tx,ty); if(n&&it.v<SEA)removeNode(n); setOvr(tx,ty,it.v); if(it.style&&it.v>=SEA)G.tstyle.set(tk(tx,ty),it.style); else G.tstyle.delete(tk(tx,ty)); G.spx.delete(tk(tx,ty)); if(it.v<SEA)G.fpx.delete(tk(tx,ty)); if(it.v<SEA){ G.floor.delete(tk(tx,ty)); }else relaxShore(tx,ty); zoomLimits(); sfx.tick();
  }else if(it.k==='n'){
    if(!first&&it.t===4)return; const cl=clsAt(tx,ty);
    if(cl<2||(it.t!==3&&cl<3&&it.t!==5&&false)){ if(first)warn('MUST BE ON LAND'); return; }
    if(G.occ.has(tk(tx,ty))||nodeAt(tx,ty)){ return; }
    addNode(it.t,tx,ty); sfx.tick();
  }else if(it.k==='tool'){
    if(it.t==='sel'){ if(!first)return; selectAt(tx,ty); }
    else if(it.t==='erase'){ eraseAt(tx,ty); }
    else if(it.t==='spawn'&&first){ if(walkableTile(tx,ty)){ const p=newPerson(tx,ty); G.P.push(p); sfx.pop(); } else warn('PICK A WALKABLE TILE'); }
  }
}
function selectAt(tx,ty){
  const wx=mouse.wx/TS, wy=mouse.wy/TS;
  let best=null,bd=.9;
  for(const p of G.P){ if(p.inside)continue; const d=Math.hypot(p.x-wx,p.y-(wy+.4)); if(d<bd){ bd=d; best=p; } }
  if(best){ sel={k:'p',o:best}; return; }
  const b=bAt(tx,ty); sel=b?{k:'b',o:b}:null;
}
function eraseAt(tx,ty){
  const b=bAt(tx,ty);
  if(b){ demolish(b); return; }
  const n=nodeAt(tx,ty); if(n){ removeNode(n); sfx.tick(); return; }
  if(G.floor.get(tk(tx,ty))){ G.floor.delete(tk(tx,ty)); G.fpx.delete(tk(tx,ty)); dirtyAround(tx,ty); sfx.tick(); }
}

function astar(sx,sy,gx,gy,adj,maxN){

      else dropSlot(i,!!(KEYS_.ShiftLeft||KEYS_.ShiftRight));
      if(G.invSel>=0&&!G.inv[G.invSel])G.invSel=-1;
    }
    return;
  }
  if(G.ui)return;

addEventListener('keydown',e=>{
  const k=e.code; KEYS_[k]=1; initAudio();
  if(k==='Tab'||k==='AltLeft'||k==='AltRight'||k==='F1')e.preventDefault();
  if(rebind){ e.preventDefault(); rebindKey(k); return; }
  if(scr==='new'&&typing){
    if(k==='Escape'||k==='Enter'){ typing=0; return; }
    if(k==='Backspace'){ seedStr=seedStr.slice(0,-1); return; }
    if(e.key&&e.key.length===1&&/[a-zA-Z0-9 ]/.test(e.key))seedAdd(e.key);
    return;
  }
  if(scr==='game'&&G){ if(G.pl)gameKey(e); return; }
  const max=menuMax();
  if(scr==='settings'){
    const rows=setRows(), r=rows[Math.min(msel,rows.length-1)];
    if(k==='Escape'){ scr=prevScr; msel=0; } else if(k==='KeyQ'){ tabS=(tabS+SETI.length-1)%SETI.length; msel=0; sscroll=0; sensure=1; } else if(k==='KeyE'){ tabS=(tabS+1)%SETI.length; msel=0; sscroll=0; sensure=1; }
    else if(k==='ArrowUp'||k==='KeyW'||k==='ArrowDown'||k==='KeyS'){ const d=(k==='ArrowUp'||k==='KeyW')?-1:1; let i=Math.min(msel,rows.length-1); for(let n=0;n<rows.length;n++){ i=(i+d+rows.length)%rows.length; if(!rows[i].info)break; } msel=i; sensure=1; }
    else if(k==='ArrowLeft'||k==='KeyA')setAdj(r,-1); else if(k==='ArrowRight'||k==='KeyD')setAdj(r,1);
    else if(k==='Enter'||k==='Space'){ if(r.keyAct)rebind=r.keyAct; else if(r.k||r.get)setAdj(r,1); else if(!r.info)r.a&&r.a(); }
    return;
  }
  if(k==='ArrowUp'||k==='KeyW')msel=(msel+max-1)%max; else if(k==='ArrowDown'||k==='KeyS')msel=(msel+1)%max;
  else if(k==='Enter'||k==='Space'){
    if(scr==='title'){ if(msel===0){ scr='new'; msel=0; } else if(msel===1&&hasSave()){ initAudio(); if(loadGame()){ scr='game'; resumeable=true; } } else if(msel===2){ prevScr='title'; scr='settings'; msel=0; tabS=0; sscroll=0; sensure=1; } }
    else if(scr==='new'){ if(msel===0)typing=1; else if(msel===1)startNew(); else if(msel===2){ scr='title'; msel=0; } }
    else if(scr==='pause'){ if(msel===0)scr='game'; else if(msel===1)saveGame(); else if(msel===2){ prevScr='pause'; scr='settings'; msel=0; tabS=0; sscroll=0; sensure=1; } else{ saveGame(true); startDemo(); scr='title'; msel=0; } }
  }else if(k==='Escape'||k==='KeyP'){ if(scr==='pause')scr='game'; else if(scr==='new'&&k==='Escape'){ scr='title'; msel=0; } }
});

/* draws the effects of an item; compact = icons and numbers in a row, otherwise one labelled line each. Returns the height used. */
function drawEffects(x,y,u,compact,maxw){
  if(!u)return 0; let cx=x, cy=y;
  for(const [k,lab,col,ic,core] of EFF){
    if(!u[k])continue; const v=(u[k]>0?'+':'')+u[k];
    if(compact){ const w=11+3+tw(v)+4; if(cx+w>x+maxw){ cx=x; cy+=12; } effChip(cx,cy,ic,col,core); T(v,cx+14,cy+2,col); cx+=w; }
    else{ effChip(x,cy,ic,col,core); T(lab+'  '+v,x+14,cy+2,col); cy+=12; }
  }
  return compact?(cx===x?0:cy-y+12):cy-y;
}

/* ---- pack helpers ---- */
const countItem=id=>G.inv.reduce((a,sl)=>a+(sl&&sl.id===id?sl.n:0),0);
const packUsed=()=>{ let n=0; for(let i=0;i<packCap();i++)if(G.inv[i])n++; return n; };
const packCap=()=>36;
function canFit(id,n){ const st=ITEMS[id].stack, cap=packCap(); let room=0; for(let i=0;i<cap;i++){ const sl=G.inv[i]; if(!sl)room+=st; else if(sl.id===id)room+=st-sl.n; } return room>=n; }
function addItem(id,n){
  const st=ITEMS[id].stack;
  const cap=packCap();
  for(let i=0;i<cap&&n>0;i++){ const sl=G.inv[i]; if(sl&&sl.id===id&&sl.n<st){ const m=Math.min(st-sl.n,n); sl.n+=m; n-=m; } }
  for(let i=0;i<cap&&n>0;i++){ if(!G.inv[i]){ const m=Math.min(st,n); G.inv[i]={id,n:m}; n-=m; } }
  return n;
}
function takeItem(id,n){ for(let i=INV-1;i>=0&&n>0;i--){ const sl=G.inv[i]; if(sl&&sl.id===id){ const m=Math.min(sl.n,n); sl.n-=m; n-=m; if(sl.n<=0)G.inv[i]=null; } } return n===0; }
function slotSwap(a,b){
  if(a===b||a>=packCap()||b>=packCap())return; const A=G.inv[a], B=G.inv[b];
  if(A&&B&&A.id===B.id){ const st=ITEMS[A.id].stack, m=Math.min(st-B.n,A.n); B.n+=m; A.n-=m; if(A.n<=0)G.inv[a]=null; return; }
  G.inv[a]=B; G.inv[b]=A;
}
function dropAt(id,n){ const P=G.pl, v=DIRVEC[P.dir]; let x=P.x+v[0]*.9, y=P.y+v[1]*.9; if(hitsBody(x,y)){ x=P.x; y=P.y; } const d={x,y,id,n,t:0,by:'p',at:G.whrs,sig:outfitSig(P),stolen:isStolenId(id),wit:[],ni:0,insp:[]}; G.drops.push(d); dropSeen(d); }
function dropSlot(i,all){ const sl=G.inv[i]; if(!sl)return; if(G.in){ toast('NOT HERE. STEP OUTSIDE FIRST',DIM); return; } const n=all?sl.n:1; dropAt(sl.id,n); sl.n-=n; if(sl.n<=0)G.inv[i]=null; sfx.drop(); }
/* ---- menus: one rule for all of them. The key that opened a menu closes it, Esc closes any menu, and the interact key also closes the camp menu. ---- */
function closeUI(){ if(G.ui==='loot'&&G.loot)lootFinish(); if(G.ui)sfx.close(); if(G.in&&G.in.fit)G.in.fit=null; G.wd=null; G.cs=null; G.ui=null; G.invSel=-1; G.cookCamp=null; G.jedit=false; G.catTyping=false; G.cook=null; }
function openUI(name){ if(G.ui===name)return; if(!G.ui)sfx.open(); else sfx.tick(); G.ui=name; G.invSel=-1; G.jedit=false; G.catTyping=false; }
function toggleUI(name){ if(G.ui===name)closeUI(); else openUI(name); }
function moveToHotbar(h){ if(G.invSel>=0&&G.invSel!==h){ slotSwap(G.invSel,h); G.invSel=h; } }

/* ---- vitals: outer meters, and cores that decide how big the meter is and how fast it refills (like RDR2) ---- */
function applyUse(u,mul){
  const P=G.pl; mul=mul||1;
  if(u.f)P.food=clamp(P.food+u.f*mul,0,100);
  if(u.hc)P.hc=clamp(P.hc+u.hc*mul,0,100);
  if(u.sc)P.sc=clamp(P.sc+u.sc*mul,0,100);
  P.mhp=60+40*P.hc/100; P.mst=60+40*P.sc/100;
  if(u.hp)P.hp=clamp(P.hp+u.hp*mul,0,P.mhp);
  if(u.so)P.st=clamp(P.st+u.so*mul,0,P.mst);
}
const USEN={f:'FOOD',hp:'HEALTH',hc:'HEALTH CORE',so:'STAMINA',sc:'STAMINA CORE'};
function canUse(u,mul){
  // an item is only refused when EVERY bar and core it would raise is already full.
  // food, health, stamina and both cores each count on their own, so a full bar never hides a core that still has room.
  const P=G.pl, E=.5, mhp=60+40*P.hc/100, mst=60+40*P.sc/100;
  const room={f:P.food<100-E, hp:P.hp<mhp-E, hc:P.hc<100-E, so:P.st<mst-E, sc:P.sc<100-E};
  let gives=0, ok=0; const names=[];
  for(const k of ['f','hp','hc','so','sc']){ if(u[k]>0){ gives=1; if(room[k])ok=1; const n=k==='f'?'FOOD':k==='hp'||k==='hc'?'HEALTH':'STAMINA'; if(!names.includes(n))names.push(n); } }
  if(ok||!gives)return true;
  toast('ALREADY FULL: '+names.join(' / '),RED); sfx.err(); return false;
}
const eatTxt=(u,m)=>{ const o=[]; for(const [k,lab] of EFF)if(u[k]>0)o.push('+'+Math.round(u[k]*(m||1))+' '+lab); return o.length?'  '+o.join(' '):''; };
function useSlot(i){
  const sl=G.inv[i]; if(!sl)return; const d=ITEMS[sl.id];
  if(d.kind==='cash'){ const v=sl.n*d.unit; G.pl.cash+=v; G.inv[i]=null; sfx.coin&&sfx.coin(); toast('EXCHANGED '+sl.n+' '+d.n+'  +'+fmtM(v),GRN); return; }
  if(d.kind==='gold'){ toast('TAKE IT TO A BANK',DIM); return; }
  if(d.kind==='camp'){ if(G.in){ toast('YOU CAN\'T CAMP INDOORS',DIM); return; } if(placeCamp()){ sl.n--; if(sl.n<=0)G.inv[i]=null; } return; }
  if(d.kind==='torch'||d.kind==='lantern'){ if(G.torch>0){ toast('YOUR LIGHT IS ALREADY BURNING',DIM); return; } G.torch=d.light||(d.kind==='lantern'?1000:300); sl.n--; if(sl.n<=0)G.inv[i]=null; toast(d.kind==='lantern'?'LANTERN LIT':'TORCH LIT',AMB); sfx.ignite(); return; }
  if(d.kind==='rod'){ if(G.in){ toast('NO FISHING INDOORS',DIM); return; } castLine(); return; }
  if(d.use){ if(!canUse(d.use))return; applyUse(d.use); sl.n--; if(sl.n<=0)G.inv[i]=null; toast('ATE '+d.n+eatTxt(d.use),GRN); sfx.eat(); return; }
  toast('NOTHING TO DO WITH THAT',DIM); sfx.err();
}
const nearLitCamp=P=>{ if(!G.camps)return false; for(const c of G.camps)if(c.fuel>0&&Math.hypot(c.x+.5-P.x,c.y+.6-P.y)<5)return true; return false; };
const HUNGER=.011;                                                  // food per second while walking: about 2.5 real hours from full to empty
function updateVitals(dt,want,shift){
  const P=G.pl, warm=P.warm=nearLitCamp(P)?1:0;
  P.mhp=60+40*P.hc/100; P.mst=60+40*P.sc/100;
  if(P.tired&&P.st>=Math.min(28,P.mst*.5))P.tired=0;
  P.sprint=!!(want&&shift&&!P.tired&&!P.wade&&P.st>0&&!P.carry&&!(G.stand&&G.stand.phase==='catch'));
  if(P.sprint){ P.st-=lerp(6.2,3,P.sc/100)*(1+(P.clPen||0))*dt; P.rest=.8; if(P.st<=0){ P.st=0; P.tired=1; P.sprint=false; P.sc=Math.max(0,P.sc-2.5); } }
  else if(P.rest>0)P.rest-=dt; else P.st=Math.min(P.mst,P.st+(9+22*P.sc/100)*(want?.6:1)*(warm?1.8:1)*(1-(P.clPen||0)*.4)*dt);
  P.st=Math.min(P.st,P.mst);
  P.food=Math.max(0,P.food-(HUNGER+(P.sprint?.02:0))*dt);
  const hungry=P.food<15, cd=(warm?0:.012)*(hungry?4:1)*dt;
  P.sc=Math.max(0,P.sc-cd); P.hc=Math.max(0,P.hc-cd*.7);
  if(P.food<=0){ P.hp-=.9*dt; P.hurt=2; }
  else if(P.hurt>0)P.hurt-=dt;
  tempEffects(dt,warm);
  P.hp=Math.min(P.hp,P.mhp);
  if(P.hp<=0&&!G.dead){ G.dead=1; closeUI(); sfx.die(); }
}
function clearWanted(){ for(const w of (G.wand||[]))w.hostile=0;                                                // death wipes the slate: no records, no hunters, no standoff, no lethal chase
  for(const V of G.vlist){ for(const r of recList(V)){ if(r.ty==='p'){ r.dead=1; if(r.st==='active'){ r.st='expired'; r.end=G.whrs; r.until=Math.min(r.until,G.whrs); } } }       // the log keeps the entry, but the case can never be woken again
    const st=vst(V); st.wanted=null; st.wasAct=false; st.heat=0; V.alert=0;
    for(const n of V.npcs){ if(n.hunt||n.aim||n.warned||n.talk){ n.hunt=0; n.chase=false; n.warned=0; n.defy=0; n.armed=0; n.aim=0; n.slot=-9; n.talk=false; n.lost=0; n.gs=null; n.sCd=0; n.bt=0; n.path=null; n.moving=false; n.st='idle'; n.wait=1; } } }
  // the old case is dead for good: witnesses drop whatever report they were running, and the old scene (blood, bodies) can never open a fresh case against the new life

}
function startReport(V,n,sev,kind){

}
function seekStreet(V,n,b,tries){

  n.busy={k:'report2',sev:b.sev,kind:b.kind,tries}; n.chase=false; n.spd=2.25; n.sleeping=false; routeTo(V,n,{x:best.x,y:best.y,inside:null,k:'lawst'}); return true;
}
function startDispatch(V,n,w,tries){
  let best=null,bd=1e9; for(const g of V.npcs){ if(g===n||!isResp(V,g)||g.inside||g.sleeping||g.hunt)continue; const d=Math.hypot(g.x-n.x,g.y-n.y); if(d<bd){ bd=d; best=g; } }
  if(!best||tries>4){ n.busy=null; tellResp(V,n,w); return false; }                       // nobody left to tell: he joins the hunt himself
  n.busy={k:'dispatch',tries}; n.chase=false; n.sleeping=false; n.warned=0; routeTo(V,n,{x:best.x,y:best.y,inside:null,k:'lawst'}); n.spd=2.3; return true;
}

  else if(b.k==='handin'&&n.tgt&&n.tgt.k==='law'){ handIn(V,n,b.id,b.n); n.busy=null; n.slot=-9; n.spd=1.15+(hash3(n.id,1,1)%50)/100; }

    if(sees||Math.random()<.3){ if(sees){ n.cSig=outfitSig(P); n.cItem=heldId(); n.cLast=curPos(V); } if(V.lawB){ startReport(V,n,b.sev,b.kind); return; } }
    n.slot=-9; n.spd=1.15+(hash3(n.id,1,1)%50)/100; }
  else if(b.k==='report2'){ n.busy=null; const w=bestRec(V); let told=0;
    if(w){ for(const g of V.npcs){ if(g===n||!isResp(V,g)||g.inside||g.sleeping)continue; if(Math.hypot(g.x-n.x,g.y-n.y)<5){ tellResp(V,g,w); told++; } }
      if(told)npcBubble(n,pickR(['THERE WAS A THIEF! THEY WEAR...','COME QUICK! SOMEONE IS ROBBING US!']),3.2); else if((b.tries||1)<3)seekStreet(V,n,b,(b.tries||1)+1); }
    if(!n.busy){ n.slot=-9; n.spd=1.15+(hash3(n.id,1,1)%50)/100; } }
  else if(b.k==='dispatch'){ n.busy=null; const w=bestRec(V);
    if(w){ for(const g of V.npcs){ if(g===n||!isResp(V,g)||g.inside||g.sleeping||g.hunt)continue; if(Math.hypot(g.x-n.x,g.y-n.y)<5)tellResp(V,g,w); }
      startDispatch(V,n,w,(b.tries||1)+1); }

function reportCrime(V,n,sev,kind,onSpot){
  const unk=n.cSig===false, s=vst(V), P=G.pl, sig=unk?null:(n.cSig||outfitSig(P)), item=unk?null:(n.cItem!==undefined?n.cItem:heldId()), last=n.cLast||curPos(V); n.cSig=null; n.cLast=null; n.cItem=undefined;
  let w=unk?activeRecs(V).find(r=>r.sig===null&&r.last&&Math.hypot(r.last.x-last.x,r.last.y-last.y)<25):activeRecs(V).find(r=>r.sig&&recHasSig(r,sig)&&r.item===item);                                 // the same description as an open case, or someone new
  if(w){ w.sev=Math.max(w.sev,sev); w.until=Math.max(w.until,G.whrs+1.6+sev*.9); if(onSpot||!w.scene)w.scene={x:last.x,y:last.y}; w.rep=(w.rep||0)+1; if(w.rep>=4&&w.sev<3)w.sev=3; if(onSpot)w.last=last; if(!w.by)w.by=n.name+' '+n.last; }
  else w=mkRec(V,{sev,sig,item,last,kind,by:n.name+' '+n.last+(n.job==='guard'?' (OFFICER)':'')});
  if(n.linkSig){ recAddSig(w,n.linkSig); n.linkSig=null; }
  const W=w; V.alert=100;
  if(onSpot){ // an officer (or farmer) who saw it himself: he gives chase and tells only those standing right next to him
    tellResp(V,n,W); for(const g of V.npcs){ if(g!==n&&isResp(V,g)&&!g.inside&&!g.sleeping&&Math.hypot(g.x-n.x,g.y-n.y)<4.5)tellResp(V,g,W); }
    return; }

  // and the witness himself also goes looking for officers on the street so the investigation starts quickly
  const lb=V.lawB, dr=lb?doorOf(V,lb.id):null, here=g=>isResp(V,g)&&!g.sleeping&&lb&&(g.inside===lb.id||(dr&&!g.inside&&Math.hypot(g.x-dr.x,g.y-dr.y)<5));
  const ans=V.npcs.filter(here);
  if(ans.length){ const canGo=!(G.in&&lb&&G.in.b.id===lb.id); let sent=false;
    ans.forEach((g,i)=>{ if(i===0&&canGo&&!g.busy){ g.cSig=null; sent=startDispatch(V,g,W,1)||sent; if(!g.busy)tellResp(V,g,W); } else if(i<3)tellResp(V,g,W); }); }
  seekStreet(V,n,{sev,kind},1);
}
function crimeSeen(V,what){ vst(V).heat+=1.5; (G.stolen||(G.stolen=[])); witnessScan(V,'theft',1); }

/* ---------- guards: look for whoever matches the description, arrest, only rarely shoot ---------- */
/* after any hunt ends the officer goes straight back to the day: the law house, the beat, lunch, whatever the clock says (never left standing in the wild) */
/* ---- dropped things: people notice what you leave on the ground, look it over, then take it, hand it in, put it back or report it ---- */
const isStolenId=id=>!!(G.stolen&&G.stolen.some(e=>e.id===id&&e.n>0));
function dropSeen(d){                                                    // who was looking when you dropped it
  const P=G.pl; if(!P)return; const rg=Math.max(8,sightRange(P));
  for(const V of G.vlist){ if(!V.active)continue; for(const n of V.npcs){ if(n.inside||n.hid||n.sleeping)continue; if(npcSees(n,P,rg))d.wit.push(n.key); } }
}
function dropScan(V,dt){
  V.dsT=(V.dsT||0)-dt; if(V.dsT>0)return; V.dsT=.7;
  if(!G.drops||!G.drops.length)return; const P=G.pl; if(!P)return; const rg=Math.max(8,sightRange(P));
  for(const d of G.drops){
    if(d.claim&&G.whrs-(d.claimT||0)>.06)d.claim=null;
    if(d.by!=='p'||d.claim||(d.ni||0)>=3||G.whrs-d.at<.004)continue; if(Math.hypot(d.x-V.cx,d.y-V.cy)>V.L+12)continue;
    let best=null, bd=1e9;
    for(const n of V.npcs){
      if(n.inside||n.hid||n.sleeping||n.busy||n.talk||n.hunt||n.exitD||n.age<14||(n.chat&&G.whrs<n.chat.until)||(d.insp&&d.insp.includes(n.key)))continue;
      const dd=Math.hypot(n.x-d.x,n.y-d.y); if(dd>rg||dd>=bd||!npcSees(n,d,rg)||Math.random()>.45)continue; best=n; bd=dd;

function inspectStart(V,n,d){

  const saw=d.wit.indexOf(n.key)>=0||(!G.in&&Math.hypot(P.x-d.x,P.y-d.y)<7&&npcSees(n,P,sightRange(P)+2));
  n.busy={k:'inspect',d,ph:'go',t:0,tries:0,saw}; n.chase=false; n.sleeping=false; n.spd=1.45; npcGoTo(V,n,d.x,d.y,1.45,false);
}
function inspectEnd(V,n,d){ if(d)d.claim=null; n.busy=null; n.slot=-9; n.spd=1.15+(hash3(n.id,1,1)%50)/100; }
function inspectTick(V,n,dt){                                            // true while they are standing over it, looking
  const b=n.busy, d=b.d; b.t+=dt;

    if(dist<1.15){ b.ph='look'; b.lt=0; n.path=null; n.moving=false; n.st='idle'; n.dir=dirFrom(d.x-n.x,d.y-n.y); return true; }
    if(n.st!=='walk'){ if(++b.tries>3){ inspectEnd(V,n,d); return false; } npcGoTo(V,n,d.x,d.y,1.45,false); }
    return false;
  }

function handIn(V,n,id,q){ (V.lostProp||(V.lostProp=[])).push({id,n:q,h:G.whrs}); vlog(V,n.name+" "+n.last+" HANDED A FOUND "+ITEMS[id].n+" TO THE LAW HOUSE."); }
function inspectDecide(V,n,b,d){
  const P=G.pl, t=n.tr||{ho:5}, law=isResp(V,n), it=ITEMS[d.id]; if(!it){ inspectEnd(V,n,d); return; }
  const near=!G.in&&Math.hypot(P.x-n.x,P.y-n.y)<12, nm=it.n+(d.n>1?' X'+d.n:'');
  (n.mem.drops||(n.mem.drops=[])).push({id:d.id,h:G.whrs,by:b.saw?'you':null}); if(n.mem.drops.length>4)n.mem.drops.shift();   // they remember it, and whether they saw who dropped it

    if(near)toast(n.name+' TAKES YOUR '+nm+' TO THE LAW HOUSE',AMB);
  } else if(r<pRep+pTake){                                               // finders keepers
    lift(); const pu=purseOf(n,V), e=pu.it.find(x=>x[0]===d.id); if(e)e[1]+=d.n; else pu.it.push([d.id,d.n]);
    if(near)toast(n.name+' PICKS UP YOUR '+nm+' AND KEEPS IT',AMB); inspectEnd(V,n,null);

/* ---- mark a location, then shout: everyone, only the law, only villagers (no police), or travellers and campers ---- */
const MARK_OPTS=[['SET MARK HERE','set'],['CLEAR MARK','clear'],['SHOUT: EVERYONE, COME HERE','all'],['SHOUT: ONLY THE LAW, COME HERE','law'],['SHOUT: VILLAGERS ONLY, NO POLICE','folk'],['SHOUT: TRAVELLERS AND CAMPERS','trav']];

function markShout(mode){
  const P=G.pl, tg=G.mark||{x:P.x,y:P.y}; closeUI(); let called=0, law=0;
  if(mode!=='trav')for(const V of G.vlist){ if(!V.active)continue;

      const isLaw=isResp(V,n); if(mode==='law'&&!isLaw)continue; if(mode==='folk'&&isLaw)continue;
      if(Math.hypot(n.x-P.x,n.y-P.y)>(isLaw?34:26))continue;
      const t=n.tr||{cu:5,fr:5}, p=isLaw?.97:clamp(.35+t.cu*.04+t.fr*.03+(n.mem.op>=10?.1:0)-(n.mem.op<=-25?.4:0),.05,.92); if(Math.random()>p)continue;
      n.busy={k:'summon',x:tg.x+(Math.random()-.5)*3.2,y:tg.y+(Math.random()-.5)*2.4,t:0,law:isLaw}; n.chase=false; n.arrB=null; n.spd=isLaw?2.2:1.7; npcGoTo(V,n,n.busy.x,n.busy.y,n.spd,false); called++; if(isLaw)law++;
    } }

    if(w.sleep||w.inside||w.hostile&&G.whrs<w.hostile||w.age<14||Math.hypot(w.x-P.x,w.y-P.y)>26||w.mem.op<=-25)continue;

  }

}

function followCheck(n,V,wand){
  const t=n.tr||{fr:5,cu:5,br:5,ho:5}, a=(!wand&&G.in&&n._a)?n._a:null;
  if(n.mem.op<=-20)return {ok:0,line:pickR(["NO. LEAVE ME ALONE.","I WOULD NOT GO ANYWHERE WITH YOU."])};
  if(a&&a.mode==='keeper')return {ok:0,line:pickR(["I HAVE A SHOP TO MIND. I CANNOT LEAVE IT.","SORRY, I CANNOT LEAVE THE COUNTER."])};
  const blk=(!wand&&V)?curBlk(V,n):null, night=G.tod>=22||G.tod<5.5, duty=!wand&&isResp(V,n), atWork=!!(blk&&blk.k==='work'&&n.work);
  let p=.07+t.fr*.022+t.cu*.015+Math.max(0,n.mem.op||0)*.003, why='';
  if(atWork){ p*=.3; why='work'; }
  if(duty){ p*=.35; why='duty'; }

  return {ok:0,line:why==='work'?pickR(["I CANNOT LEAVE MY WORK RIGHT NOW.","I AM IN THE MIDDLE OF MY WORK."]):why==='duty'?"I AM ON DUTY. COME TO THE LAW HOUSE IF YOU NEED ME.":why==='late'?pickR(["IT IS FAR TOO LATE FOR THAT. TOMORROW, MAYBE.","NOT AT THIS HOUR."]):why==='road'?pickR(["I HAVE A LONG ROAD AHEAD OF ME. I CANNOT STOP.","I MUST KEEP MOVING. SORRY."]):t.br<=3?"I DO NOT KNOW YOU. I WOULD RATHER NOT.":pickR(["SORRY, I HAVE THINGS TO DO.","NOT NOW. SOME OTHER TIME.","NO, I DO NOT THINK SO."])};
}

  if(A==='B'||A==='K'){ if(B==='H')return w(A==='B'?'BROTHER':'COUSIN',A==='B'?'SISTER':'COUSIN'); }

   TEMPERATURE: one temperature per day (season + that day's weather luck), a smooth warm-up and cool-down through the day,
   adjusted for the climate and height of where you stand, for indoors, fires and what you wear

function dayTemp(dn){
  const c=dnToYMD(dn), doy=dn-ymdToDn(c.y,1,1)+1+(SET.south?182:0), seed=(G.seed|0)%100003;
  const season=10.5+12.5*Math.sin(2*Math.PI*(doy-110)/365);
  const r=d=>h2(d,17,seed+700)+h2(d,19,seed+701)-1;                 // -1..1, bell shaped
  const luck=(.62*r(dn)+.38*r(dn-1))*9;                                // this day's mild or harsh turn, a little like yesterday's
  const swing=3.8+3.2*h2(dn,23,seed+702);                              // clear days swing more than grey ones
  return {mean:season+luck,swing};
}
function worldTemp(){
  const P=G.pl; if(!P)return 12; const dt=dayTemp(G.dn), t=G.tod;
  const base=dt.mean+dt.swing*Math.cos(2*Math.PI*(t-15)/24);
  let off=0; if(SET.tempMode===0){ try{ const v=tileV(Math.floor(P.x),Math.floor(P.y)); climate(P.x,P.y); off=((CLT-Math.max(0,v-.5)*.7)-.5)*16; }catch(e){} }      // setting: by biome, or only time, date and season

}

  if(G.in||G.tr)t=lerp(t,19,.68);
  let ins=0; const w=P.cl&&P.cl.worn; if(w){ if(w.jacket>0)ins+=6; if(w.top>=0&&w.top!==undefined)ins+=1.5; if(w.hat>0)ins+=1; if(w.gloves>0)ins+=1; if(w.top<0)ins-=4; if(w.pants<0)ins-=4; }

  return {air:t,feel:t<16?t+ins:t-Math.max(0,ins-3)*.5};
}

/* ---- rooms: layout per kind ---- */
const RBUILD={};
const ENTERABLE=new Set(['house','barn','windmill','smithy','bakery','market','tavern','church','library','hall','hall2','school','clinic','inn','chapel','workshop','shop','stable','warehouse','sawmill']);
const enterable=b=>{ if(!b||b.prog<1)return false; const d=BT[b.t]; if(d.walk)return false; if(d.door==='none'&&d.k!=='market')return false; return ENTERABLE.has(d.k); };
function makeRoom(b){
  const d=BT[b.t], k=d.k, rn=rng(hash3(b.x*131+7,b.y*977+3,(G.seed|0)&0xffffff)), pk=a=>a[Math.floor(rn()*a.length)];
  const Rm={b,k,t:b.t,rn,w:10,h:7,floor:'wood',wt:b.tx|0,wc:b.wc,wood:pk(WOODS),fc:0xb08050,items:[],wdec:[],lights:[],win:[],keep:[],seats:[],beds:[],loot:[],door:5,sp:shopOf(b),cv:null,spots:[],rects:[]};
  const A={
    add(kind,x,y,w,h,o){ const spec=FK[kind]; if(!spec)return null; if(spec.hg!==undefined&&!spec.flat&&(y+h>Rm.h-2.2&&Math.abs(x+w/2-Rm.door)<(w/2+1.3)&&!(o&&o.free)))return null;
      const it=Object.assign({k:kind,x,y,w,h,hg:spec.hg||0,ex:spec.ex||0,solid:spec.solid!==false&&!spec.flat&&!(o&&o.flat),col:Rm.wood,seed:Math.floor(rn()*997),wc:Rm.wc,spec},o||{}); Rm.items.push(it); return it; },
    win(x){ Rm.win.push(x); Rm.wdec.push({t:'window',x}); }, pic(x,c){ Rm.wdec.push({t:'pic',x,c:c||pk([0x3a6a8a,0x8a4a3a,0x4a7a4a,0x8a7a3a])}); },
    wshelf(x,w,row,ids){ Rm.wdec.push({t:'wshelf',x,w,row,ids}); }, hooks(x,w,kind){ Rm.wdec.push({t:'hooks',x,w,kind}); },
    banner(x,c){ Rm.wdec.push({t:'banner',x,c}); }, board(x,w){ Rm.wdec.push({t:'board',x,w}); }, cross(x){ Rm.wdec.push({t:'cross',x}); }, clock(x){ Rm.wdec.push({t:'clock',x}); },
    light(x,y,r,a,kind){ Rm.lights.push({x:x*IS,y:y*IS,r,a,k:kind||'warm'}); },
    seat(x,y,face){ Rm.seats.push({x,y,face}); }, keep(x,y,face,role){ Rm.keep.push({x,y,face:face||0,role}); },
    ids(n){ const s=Rm.sp?Rm.sp.sells:[]; const out=[]; for(let i=0;i<n&&s.length;i++)out.push(s[(i*3+Math.floor(rn()*s.length))%s.length]); return out; },
    all(){ return Rm.sp?Rm.sp.sells.filter(i=>ITEMS[i]):[]; },
    pk, rn, d, b, Rm, tableSet(x,y,w,n,stuff){ const t=A.add('table',x,y,w,1,{stuff:stuff||[{t:'plate',x:6,y:5},{t:'mug',x:w*16-8,y:6}]}); for(let i=0;i<n;i++){ const cx=x+0.5+i*(w-1)/Math.max(1,n-1+(n===1?1:0)); A.add('chair',x+(n===1?.5:i*((w-1)/Math.max(1,n-1))),y+1.1,1,1,{face:'n'}); A.seat(x+(n===1?.5:i*((w-1)/Math.max(1,n-1)))+.5,y+1.6,'n'); } return t; }
  };
  (RBUILD[k]||RBUILD.house)(A,Rm,rn,b,d); pruneWindows(Rm);
  // door position: near the middle, never under furniture
  Rm.door=Rm.door||Math.floor(Rm.w/2)+.5;
  // collision rects and spots
  for(const it of Rm.items)if(it.solid)Rm.rects.push([it.x+(it.k==='chair'?.18:0),it.y+(it.k==='chair'?.2:0),it.w-(it.k==='chair'?.36:0),it.h-(it.k==='chair'?.3:0)]);
  for(let y=1;y<Rm.h-.5;y+=1)for(let x=1;x<Rm.w-.5;x+=1){ const sx=x-.5+.5, sy=y+.1; if(!rectHit(Rm,sx,sy,.3,.2)&&sy<Rm.h-1.2)Rm.spots.push([sx,sy]); }
  Rm.items.sort((a,c)=>(a.y+a.h)-(c.y+c.h));
  return Rm;
}
function pruneWindows(Rm){   // a window is only kept where it clears the other windows, tall furniture against the wall and wall decorations; otherwise it slides to the nearest free spot

function trvById(id){ const m=/^T(-?\d+),(-?\d+)#(-?\d+)$/.exec(id); if(!m)return null; const st=vilSite(+m[1],+m[2]); if(!st)return null; return trvGet(id,st,+m[3],trvCand(st),vilTier(st)); }

function trvMake(pt,pos){

function trvSync(pt,w){      // the schedule follows the real walker (never the other way round), so nobody is ever placed ahead of where they really are

}
function trvTarget(w){      // where a travelling walker should head right now: a little ahead of its party's place on the schedule
  const pt=trvById(w.party); if(!pt)return null; let s=trvS(pt); const me=w.fam&&w.fam.me|0;
  const cur=trvAt(pt,Math.max(0,Math.min(pt.L,s))); if(Math.hypot(cur.x-w.x,cur.y-w.y)>22){
    if(trvSync(pt,w))s=trvS(pt); else if(!wBlocked(cur.x,cur.y,false)&&Math.hypot(G.pl.x-w.x,G.pl.y-w.y)>70&&Math.hypot(G.pl.x-cur.x,G.pl.y-cur.y)>70){ w.x=cur.x; w.y=cur.y; w.rt=[]; } }      // only a walker lost far off the road, and out of sight, is put back on it
  if(s>=pt.L-.6){ return Math.hypot(w.x-pt.dest.x,w.y-pt.dest.y)<2?null:{x:pt.dest.x,y:pt.dest.y}; }
  const t=trvAt(pt,Math.min(pt.L,s+5)); return {x:t.x+((me%2)?1:-1)*(.5+me*.35),y:t.y+(me%3)*.4};
}
function trvArrive(pt,ms){      // a party reaches its town out of the player's sight: the same arrival, stay, settle-or-move-on life as when watched
  G.tdone.add(pt.id); const W=G.vil.get(pt.dest.key); if(!W||!W.B.length){ if(ms)for(const w of ms){ w.party=null; } return; }
  if(!ms){ if(G.wand.length+4>WMAX+12)return; ms=trvMake(pt,{x:W.cx,y:W.cy}); } else{ if(G.wand.length+ms.length>WMAX+12)return; for(const w of ms)G.wand.push(w); }
  ms.forEach((w,i)=>{ w.x=W.cx+(i%2?1:-1)*(1+i*.4); w.y=W.cy+2+(i%3)*.6; w.moving=false; w.camp=null; w.sleep=false; w.st='walk'; w.rt=[]; wArrive(w); });
}
function trvTick(dt){
  const P=G.pl; if(!P||G.demo)return; if(!G.tdone)G.tdone=new Set(); if(!G.tdelay)G.tdelay=new Map(); if(!G.tpark)G.tpark=new Map(); if(!G.tmat){ G.tmat=new Set(); for(const w of G.wand)if(w.party)G.tmat.add(w.party); }
  G._trvDt=(G._trvDt||0)+dt; G._trvT=(G._trvT||0)-dt; if(G._trvT>0)return; const el=G._trvDt; G._trvDt=0; G._trvT=2.5; G.tft=(G.tft||0)+1;
  const A=G.dn*24+G.tod, ci0=Math.floor(P.x/VCELL), cj0=Math.floor(P.y/VCELL); G._cb=5;      // only a few new roads are worked out per tick, so there is never a hitch
  // parties near the player step out of the unseen simulation and become real people
  for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++){ const st=vilSite(ci0+a,cj0+b); if(!st)continue; if(!(G.tcand&&G.tcand.has(st.key))){ if((G._cb=(G._cb===undefined?5:G._cb)-1)<0)continue; } const cand=trvCand(st); if(!cand.length)continue; const tier=vilTier(st);
    for(let sl=Math.floor((A-TRV_MAXH)/TRV_SLOT);sl<=Math.floor(A/TRV_SLOT);sl++){ const id='T'+st.key+'#'+sl; if(G.tdone.has(id)||G.tmat.has(id))continue;
      const pt=trvGet(id,st,sl,cand,tier); if(!pt)continue; const s=trvS(pt); if(s<0)continue; if(s>=pt.L-1){ if(s>=pt.L&&s<pt.L+pt.v*.6&&!G.tpark.has(id))trvArrive(pt,null); continue; } const pos=trvAt(pt,s), d=Math.hypot(pos.x-P.x,pos.y-P.y); if(d>TRV_ON||(d<38&&G.tft>3))continue;

    if(ms.some(w=>w.talk||w.st==='rest'))G.tdelay.set(id,(G.tdelay.get(id)||0)+el*GAME_RATE/3600);

}
function wandInit(){
  G.wand=[]; G.wfires=[]; G._wlt=G.whrs; G._wnow=G.dn*24+G.tod; G._ltn=0; const P=G.pl;
  const near=G.vlist.filter(V=>V.B.length&&V.npcs.length).sort((a,b)=>Math.hypot(a.cx-P.x,a.cy-P.y)-Math.hypot(b.cx-P.x,b.cy-P.y));
}
function wandUpdate(dt){
  if(!G||G.demo||!G.pl)return;
  if(G.wand===undefined){ if(G.vlist.length&&frameNo>40)wandInit(); else return; }
  if(!G.wfires)G.wfires=[]; if(G._wlt===undefined){ G._wlt=G.whrs; G._wnow=G.dn*24+G.tod; G._ltn=0; }
  const now=G.dn*24+G.tod, el=now-(G._wnow===undefined?now:G._wnow); G._wnow=now;
  if(el>.6)wandJump(el);
  const gh=G.whrs-(G._wlt||0);

  const P=G.pl; G.wfires.length=0; G._stT=(G._stT||0)-dt; if(G._stT<=0||!G.sites){ G._stT=1; siteTick(); }
  for(const w of G.wand.slice()){

    if(d>560&&w.to&&!w.to.b){ wGone(w,"FAR"); continue; }
    if(w.camp&&w.camp.fire&&(w.st==='camp'||w.st==='rest'))G.wfires.push({x:w.camp.x,y:w.camp.y,fuel:99,id:w.id});
  }
  siteUpdate(); trvTick(dt); outUnusual(dt);
}
/* ---- talking to wanderers ---- */
function wGreet(w){
  const t=w.tr, r=Math.random(); let pool;
  if(w.mem.op<=-20)pool=["YOU. KEEP AWAY FROM ME.","I HAVEN'T FORGOTTEN YOU."+(w.mem.at?" "+w.mem.at+" WAS NOT THE BEST DAY.":"")];
  else if(w.mem.met>0&&w.mem.at&&w.mem.op>=8&&r<.75)pool=["WELL, LOOK WHO IT IS! WE MET IN "+w.mem.at+".","I KNOW YOU. "+w.mem.at+", WASN'T IT? GOOD TO SEE YOU AGAIN."];
  else if(w.poor&&w.hun>45)pool=["SPARE A BITE FOR A TIRED TRAVELLER.","EXCUSE ME. HAVE YOU ANYTHING TO EAT.","HELLO. I'LL NOT LIE. I'M HUNGRY."];
  else if(w.st==='camp')pool=["COME SIT BY THE FIRE IF YOU LIKE.","EVENING. THE FIRE'S FREE TO ANYONE."];
  else if(t.te>=7)pool=["WHAT DO YOU WANT.","I'M BUSY WALKING. MAKE IT QUICK."];
  else if(t.fr>=6)pool=["WELL MET, FRIEND! THE ROAD'S LONG AND COMPANY IS RARE.","GOOD DAY TO YOU, TRAVELLER!","AH, ANOTHER SOUL ON THE ROAD. HELLO!"];
  else if(w.ex)pool=["HELLO. I'M NOT LOOKING FOR TROUBLE.","YES. WHAT IS IT."];
  else pool=["GOOD DAY.","HELLO THERE.","YES."];
  return pool[Math.floor(r*pool.length)];
}
function wandTalkOpen(w){
  const P=G.pl; w.talk=true; w.moving=false; w.dir=dirFrom(P.x-w.x,P.y-w.y); const m=w.mem; let line;

}
function wFromText(w){

function wToText(w){

function drawWCamp(w){
